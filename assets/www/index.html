let state={learned:{},marked:{},xp:0,theme:'light',currentStreak:0,longestStreak:0,lastActiveDate:''};
const $=id=>document.getElementById(id);
const txt=x=>String(x??'').replace(/\s+/g,' ').trim();
const esc=x=>txt(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'{}');if(x&&typeof x==='object'){state.learned=x.learned||{};state.marked=x.marked||{};state.xp=Number(x.xp)||0;state.theme=x.theme==='dark'?'dark':'light';state.currentStreak=Number(x.currentStreak)||0;state.longestStreak=Number(x.longestStreak)||0;state.lastActiveDate=x.lastActiveDate||''}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function theme(){document.body.classList.toggle('dark',state.theme==='dark');$('theme').textContent=state.theme==='dark'?'☀':'☾'}
function arr(n){return WORDS.slice(n*SIZE,(n+1)*SIZE)}
function todayKey(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayDiff(a,b){let A=new Date(a+'T00:00:00'),B=new Date(b+'T00:00:00');return Math.round((B-A)/86400000)}
function touchStreak(){let t=todayKey();if(state.lastActiveDate===t)return; if(!state.lastActiveDate||dayDiff(state.lastActiveDate,t)>1)state.currentStreak=1;else if(dayDiff(state.lastActiveDate,t)===1)state.currentStreak++;state.lastActiveDate=t;if(state.currentStreak>state.longestStreak)state.longestStreak=state.currentStreak;save()}
function stats(){let n=Object.keys(state.learned).filter(k=>state.learned[k]).length,pc=Math.round(n/WORDS.length*100);$('learned').textContent=n;$('percent').textContent=pc+'%';$('xp').textContent=state.xp;$('streak').textContent=state.currentStreak;$('streakInfo').textContent=state.currentStreak+' روز';$('bestStreak').textContent=state.longestStreak+' روز';$('overallText').textContent=n+' / '+WORDS.length+' — '+pc+'%';$('overallBar').style.width=pc+'%'}
function lessons(){let root=$('lessons');root.innerHTML='';for(let n=0;n<LESSONS;n++){let a=arr(n),done=a.filter((_,i)=>state.learned[n*SIZE+i]).length,b=document.createElement('button');b.type='button';b.className='lesson';b.innerHTML='<div class="num">درس '+(n+1)+'</div><div class="title">Lesson '+(n+1)+'</div><div class="count">'+a.length+' کلمه · '+done+' یادگرفته</div><div class="progress"><i style="width:'+Math.round(done/a.length*100)+'%"></i></div>';b.addEventListener('click',()=>openLesson(n));root.appendChild(b)}}
function modal(title,body){$('title').textContent=title;$('body').innerHTML=body;$('overlay').classList.add('open')}
function close(){ $('overlay').classList.remove('open') }
function isMarked(k){return !!state.marked[k]}
function toggleMark(k){if(state.marked[k])delete state.marked[k];else state.marked[k]=true;save();renderMarked();openMarkedIfVisible()}
function renderMarked(){let box=$('markedSection'),list=$('markedList'),keys=Object.keys(state.marked).filter(k=>state.marked[k]&&WORDS[Number(k)]);if(!keys.length){list.innerHTML='<div class="empty" style="grid-column:1/-1">هنوز کلمه‌ای نشان نشده است.</div>';return}list.innerHTML=keys.map(k=>{let x=WORDS[Number(k)];return '<div class="marked-card"><button class="star" data-unmark="'+k+'" title="حذف از نشان‌شده‌ها">★</button><div class="en">'+esc(x.w)+'</div><div class="phonetic">['+esc(x.p||'')+']</div><div class="fa">'+esc(x.m)+'</div><button class="pron" data-speak="'+esc(x.w)+'">🔊 تلفظ</button></div>'}).join('');list.querySelectorAll('[data-unmark]').forEach(b=>b.onclick=()=>{delete state.marked[b.dataset.unmark];save();renderMarked()});list.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speakWord(b.dataset.speak))}
function openMarkedIfVisible(){if($('markedSection').style.display!=='none')renderMarked()}
function showMarked(){let sec=$('markedSection');sec.style.display=sec.style.display==='none'?'block':'none';if(sec.style.display!=='none')renderMarked();if(sec.style.display!=='none')sec.scrollIntoView({behavior:'smooth',block:'start'})}
function speakWord(word){if(!('speechSynthesis' in window)){alert('تلفظ صوتی در این دستگاه در دسترس نیست.');return}window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.78;window.speechSynthesis.speak(u)}
function openLesson(n){let a=arr(n),body='<div style="color:var(--muted);font-size:12px">'+a.length+' کلمه</div>';a.forEach((x,i)=>{let k=n*SIZE+i;body+='<div class="word"><div class="markrow"><div class="en">'+esc(x.w)+'</div><button class="star" data-mark="'+k+'" title="'+(isMarked(k)?'حذف نشان':'نشان کردن')+'">'+(isMarked(k)?'★':'☆')+'</button></div><div class="phonetic">['+esc(x.p||'')+']</div><div class="fa">'+esc(x.m)+'</div><button class="pron" data-speak="'+esc(x.w)+'">🔊 تلفظ</button>'+(x.ex?'<div class="example">'+esc(x.ex)+'</div>':'')+'<button class="btn" data-learn="'+k+'" style="margin-top:9px;padding:8px 12px;font-size:12px">'+(state.learned[k]?'✓ یادگرفته شد':'علامت‌گذاری')+'</button></div>'});body+='<div style="display:flex;gap:8px;margin-top:15px;flex-wrap:wrap"><button id="quiz" class="btn">آزمون درس</button><button id="x" class="btn secondary">بستن</button></div>';modal('درس '+(n+1),body);document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>{let k=b.dataset.mark;toggleMark(k);b.textContent=isMarked(k)?'★':'☆'});document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speakWord(b.dataset.speak));document.querySelectorAll('[data-learn]').forEach(b=>b.onclick=()=>{let k=b.dataset.learn;if(!state.learned[k]){state.learned[k]=true;state.xp+=5;touchStreak();save()}b.textContent='✓ یادگرفته شد';stats();lessons()});$('x').onclick=close;$('quiz').onclick=()=>quiz(a,'آزمون درس '+(n+1),Math.min(10,a.length))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function questions(pool,count){let chosen=shuffle(pool.filter(x=>txt(x.w)&&txt(x.m))).slice(0,count),all=WORDS.filter(x=>txt(x.m)),out=[];for(let c of chosen){let seen=new Set([txt(c.m)]),bad=[];for(let x of shuffle(all)){let m=txt(x.m);if(!m||seen.has(m))continue;seen.add(m);bad.push(x);if(bad.length===3)break}if(bad.length===3)out.push({c,o:shuffle([c,...bad])})}return out}
function info(s){return s>=90?['عالی','#16a34a',100]:s>=75?['خیلی خوب','#2563eb',75]:s>=60?['خوب','#d97706',50]:s>=40?['نیاز به مرور','#ea580c',25]:['نیاز به تمرین بیشتر','#dc2626',10]}
function quiz(pool,title,count){let qs=questions(pool,count),i=0,right=0;if(!qs.length){modal(title,'<div class="empty">سؤال معتبر کافی نیست.</div>');return}function draw(){if(i>=qs.length){let s=Math.round(right/qs.length*100),r=info(s);state.xp+=r[2];touchStreak();save();modal('نتیجه آزمون','<div class="result"><div style="color:var(--muted)">'+esc(title)+'</div><div class="score" style="color:'+r[1]+'">'+s+'</div><div>از ۱۰۰</div><div class="badge" style="background:'+r[1]+'20;color:'+r[1]+'">'+r[0]+'</div><div class="resultbox"><div class="row"><span>صحیح</span><b>'+right+' از '+qs.length+'</b></div><div class="row"><span>نمره</span><b>'+s+' از ۱۰۰</b></div><div class="row"><span>XP</span><b>+'+r[2]+'</b></div></div><button id="resultClose" class="btn secondary" style="margin-top:14px">بستن</button></div>');$('resultClose').onclick=close;stats();return}let q=qs[i];modal(title,'<div style="color:var(--muted);font-size:12px">سؤال '+(i+1)+' از '+qs.length+'</div><div class="q">معنی <span dir="ltr">'+esc(q.c.w)+'</span> کدام است؟</div><div class="opts">'+q.o.map((x,k)=>'<button class="opt" data-opt="'+k+'">'+esc(x.m)+'</button>').join('')+'</div>');document.querySelectorAll('[data-opt]').forEach((b,k)=>b.onclick=()=>{document.querySelectorAll('[data-opt]').forEach(z=>z.disabled=true);if(q.o[k].w===q.c.w){right++;b.style.borderColor='var(--ok)';b.style.background='#f0fdf4'}else{b.style.borderColor='var(--bad)';b.style.background='#fef2f2';document.querySelectorAll('[data-opt]').forEach((z,j)=>{if(q.o[j].w===q.c.w){z.style.borderColor='var(--ok)';z.style.background='#f0fdf4'}})}i++;setTimeout(draw,450)})}draw()}
$('theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';theme();save()};$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};$('markedBtn').onclick=showMarked;$('hideMarked').onclick=showMarked;$('globalQuiz').onclick=()=>quiz(WORDS,'آزمون جامع ۵۰۴',20);$('reset').onclick=()=>{if(confirm('همه پیشرفت، نشان‌ها، استریک و XP پاک شود؟')){state={learned:{},marked:{},xp:0,theme:state.theme,currentStreak:0,longestStreak:0,lastActiveDate:''};save();stats();lessons();renderMarked()}};load();theme();stats();renderMarked();lessons();
</script></body></html>
